<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Conversor S-21</title>
<meta name="description" content="Converte cartões S-21 preenchíveis em arquivos de importação (Hourglass e TSWin), direto no aparelho.">
<link rel="stylesheet" href="/ferramentas/S21_Export/style.css">
</head>
<body>
<header class="top"><h1>Conversor S-21</h1><p>Os cartões são lidos só neste aparelho. Nada é enviado pela internet.</p></header>
<main>
  <label class="drop" id="drop">
    <input type="file" id="files" accept="application/pdf,.pdf" multiple hidden>
    <span class="big">⬆</span>
    <strong>Selecionar cartões S-21</strong>
    <small>PDF preenchível · pode escolher vários</small>
  </label>

  <section id="summary" hidden>
    <div class="totals" id="totals"></div>
    <p class="hint" id="warnline"></p>
  </section>

  <section id="list"></section>

  <div class="actions" id="actions" hidden>
    <button class="ghost" id="clear">Limpar</button>
    <button class="primary" id="export" aria-label="Baixar planilha Hourglass (.xlsx)">⬇ Hourglass<small>.xlsx</small></button>
    <button class="primary" id="exportXml" aria-label="Baixar arquivo TSWin (Active.xml)">⬇ TSWin<small>Active.xml</small></button>
  </div>
</main>
<script src="/ferramentas/S21_Export/pdf-lib.min.js"></script>
<script src="/ferramentas/S21_Export/xlsx.full.min.js"></script>
<script src="/ferramentas/S21_Export/converter.js"></script>
<script src="/ferramentas/S21_Export/app.js"></script>
</body>
</html>
