<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Conversor S-21</title>
<meta name="description" content="Converte cartões S-21 preenchíveis em arquivos de importação (Circuit Manager, Hourglass e TSWin), direto no aparelho.">
<link rel="stylesheet" href="/ferramentas/S21_Export/style.css">
</head>
<body>
<header class="top"><h1>Conversor S-21</h1><p>Os cartões são lidos só neste aparelho. Nada é enviado pela internet.</p></header>
<main>
  <label class="drop" id="drop">
    <input type="file" id="files" accept="application/pdf,.pdf" multiple hidden>
    <span class="big">⬆</span>
    <strong>Selecionar cartões S-21</strong>
    <small>PDF preenchível · pode escolher vários</small>
  </label>

  <section id="cong" class="cong" hidden>
    <h2>Dados da congregação <small>(opcional · para o Circuit Manager)</small></h2>
    <div class="grid">
      <label class="full">Nome<input id="congName" autocomplete="off" placeholder="Ex.: Central"></label>
      <label>Número<input id="congNumber" inputmode="numeric" autocomplete="off" placeholder="Ex.: 12345"></label>
      <label>País<select id="congCountry"></select></label>
    </div>
  </section>

  <section id="summary" hidden>
    <div class="totals" id="totals"></div>
    <p class="hint" id="warnline"></p>
  </section>

  <section id="list"></section>

  <section class="actions" id="actions" hidden>
    <h2>Baixar arquivo para o seu programa</h2>
    <button class="primary dl" id="exportJson" aria-label="Baixar arquivo do Circuit Manager (.json)"><b>⬇ Circuit Manager <span>.json</span></b><small>Mesmo formato do hourglass-export</small></button>
    <button class="primary dl" id="export" aria-label="Baixar planilha Hourglass (.xlsx)"><b>⬇ Hourglass <span>.xlsx</span></b><small>Planilha hourglass-import</small></button>
    <button class="primary dl" id="exportXml" aria-label="Baixar arquivo TSWin (Active.xml)"><b>⬇ TSWin <span>Active.xml</span></b><small>Arquivo de publicadores do TSWin</small></button>
    <button class="ghost" id="clear">Limpar todos os cartões</button>
  </section>
</main>
<script src="/ferramentas/S21_Export/pdf-lib.min.js"></script>
<script src="/ferramentas/S21_Export/xlsx.full.min.js"></script>
<script src="/ferramentas/S21_Export/converter.js"></script>
<script src="/ferramentas/S21_Export/app.js"></script>
</body>
</html>
